[General]
discordUrl=https://discord.com
csfFile = general.csf

# Where game resources are located
# Split CDN packs (ini.mix / ui.mix / ...) — leave empty to skip
gameresBaseUrl=
# Derived flat packs from Go mix-cache (built from the few source mixes in /game-res/).
# Operators only maintain ra2/language/multi/theme under public/game-res/; nested packs
# are unpacked + cached by the Go server into data/mix-cache and served here.
originalGameResUrl=/mix-cache/
mapsBaseUrl=/cdn/maps/
modsBaseUrl=/mods/
gameResArchiveUrl=https://download.ra2web.com/full-pack.7z
patchNotesUrl=//www.ra2web.com/patch-notes.html
ladderRulesUrl=//www.ra2web.com/ladder-rules.html
modSdkUrl=https://github.com/ra2web/mod-sdk
breakingNewsUrl=/breaking-news.html
oldClientsBaseUrl=/old/
quickMatchEnabled=yes
botsEnabled=yes
debugLogging=wol
defaultLanguage=zh-CN
# WebSocket full-relay (same origin as the page). Prefer /ws so http→ws / https→wss auto-match.
# Absolute urls also work; ws:// is upgraded to wss:// when the page is HTTPS.
netplayWsUrl=/ws

viewport.width=1024
viewport.height=768
